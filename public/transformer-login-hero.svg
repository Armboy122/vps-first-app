<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F8FAFC"/>
  
  <!-- Subtle Control Grid Overlay -->
  <g opacity="0.1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800" stroke="#475569" stroke-width="1"/>
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Distant Utility Poles & Lines -->
  <g stroke="#94A3B8" stroke-width="1.5" opacity="0.4">
    <path d="M100 500V250M90 270H110M85 290H115" />
    <path d="M700 450V200M690 220H710M685 240H715" />
    <!-- Power Lines -->
    <path d="M0 240C200 260 400 260 800 240" fill="none" stroke-dasharray="4 4"/>
    <path d="M0 260C200 280 400 280 800 260" fill="none" stroke-dasharray="4 4"/>
  </g>

  <!-- Main Transformer Silhouette (The Focal Point) -->
  <g transform="translate(250, 150)">
    <!-- Main Body -->
    <rect x="50" y="150" width="200" height="250" rx="4" fill="#1E293B"/>
    <rect x="70" y="170" width="160" height="210" rx="2" fill="#334155"/>
    
    <!-- Cooling Fins -->
    <rect x="35" y="180" width="15" height="180" rx="2" fill="#475569"/>
    <rect x="250" y="180" width="15" height="180" rx="2" fill="#475569"/>
    <rect x="15" y="200" width="15" height="140" rx="2" fill="#475569" opacity="0.6"/>
    <rect x="270" y="200" width="15" height="140" rx="2" fill="#475569" opacity="0.6"/>

    <!-- Bushings/Insulators -->
    <g transform="translate(75, 100)">
      <rect x="0" y="20" width="30" height="30" rx="2" fill="#D97706"/>
      <path d="M5 20L15 0L25 20H5Z" fill="#F59E0B"/>
      <rect x="12" y="-20" width="6" height="20" fill="#64748B"/>
    </g>
    <g transform="translate(135, 100)">
      <rect x="0" y="20" width="30" height="30" rx="2" fill="#D97706"/>
      <path d="M5 20L15 0L25 20H5Z" fill="#F59E0B"/>
      <rect x="12" y="-20" width="6" height="20" fill="#64748B"/>
    </g>
    <g transform="translate(195, 100)">
      <rect x="0" y="20" width="30" height="30" rx="2" fill="#D97706"/>
      <path d="M5 20L15 0L25 20H5Z" fill="#F59E0B"/>
      <rect x="12" y="-20" width="6" height="20" fill="#64748B"/>
    </g>

    <!-- Control Panel Detail -->
    <rect x="90" y="250" width="40" height="60" rx="2" fill="#0F172A"/>
    <circle cx="100" cy="265" r="3" fill="#10B981"/> <!-- Green Status -->
    <circle cx="110" cy="265" r="3" fill="#475569"/>
    <rect x="98" y="275" width="24" height="2" fill="#475569"/>
    <rect x="98" y="282" width="18" height="2" fill="#475569"/>
  </g>

  <!-- Ground Line -->
  <path d="M100 550H700" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Abstract Data Circles (Network Overlay) -->
  <circle cx="580" cy="200" r="8" fill="#10B981" opacity="0.8"/>
  <circle cx="620" cy="180" r="4" fill="#F59E0B" opacity="0.6"/>
  <path d="M580 200L620 180" stroke="#10B981" stroke-width="1" stroke-dasharray="2 2"/>
  
  <circle cx="200" cy="400" r="6" fill="#10B981" opacity="0.5"/>
  <circle cx="160" cy="420" r="10" fill="#F59E0B" opacity="0.4"/>
  <path d="M200 400L160 420" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Subtle Glows -->
  <defs>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 250) rotate(90) scale(300)">
      <stop stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#amberGlow)"/>
</svg>
