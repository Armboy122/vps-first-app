x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: peas3-db
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresql_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mynetwork
    logging: *default-logging

  app:
    container_name: peas3-app
    image: ${APP_IMAGE}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_GENERATE_PDF: ${NEXT_PUBLIC_GENERATE_PDF}
      NODE_ENV: production
      PORT: 3000
    networks:
      - mynetwork
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Liveness must not create a database query every 20 seconds. Deployment
      # readiness is still verified through /api/health by deploy-server.sh.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

volumes:
  postgresql_pgdata:
    driver: local

networks:
  mynetwork:
    driver: bridge
