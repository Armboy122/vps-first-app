name: peas3-uat

x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    container_name: peas3-uat-app
    image: ${APP_IMAGE}
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_GENERATE_PDF: ${NEXT_PUBLIC_GENERATE_PDF}
      NODE_ENV: production
      PORT: ${APP_PORT:-3001}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-3001}/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
